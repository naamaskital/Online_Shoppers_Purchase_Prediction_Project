43</text><rect x="260" y="294" width="301.9" height="17" rx="4" fill="#38bdf8"/><text x="571.9" y="308" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="13">0.8879</text><text x="32" y="358" fill="#e5e7eb" font-family="Arial,sans-serif" font-size="17">Decision Tree</text><rect x="260" y="341" width="174.7" height="17" rx="4" fill="#a78bfa"/><text x="444.7" y="355" fill="#f5f3ff" font-family="Arial,sans-serif" font-size="13">0.5137</text><rect x="260" y="366" width="242.3" height="17" rx="4" fill="#38bdf8"/><text x="512.3" y="380" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="13">0.7127</text><text x="32" y="430" fill="#e5e7eb" font-family="Arial,sans-serif" font-size="17">KNN</text><rect x="260" y="413" width="166.6" height="17" rx="4" fill="#a78bfa"/><text x="436.6" y="427" fill="#f5f3ff" font-family="Arial,sans-serif" font-size="13">0.4899</text><rect x="260" y="438" width="259.5" height="17" rx="4" fill="#38bdf8"/><text x="529.5" y="452" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="13">0.7633</text><text x="32" y="516" font-size="13" font-family="Arial,sans-serif" fill="#94a3b8">Source: baseline results table in this repository's README.</text></svg>